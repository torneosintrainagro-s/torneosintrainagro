<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwSPtk7m5Ulc2EcSQ486KZFoJiL91dG9sZeKXIFb07oWifRyuQmVobIVlJvFJUawdPK/exec';

// ===================== DATOS EN MEMORIA =====================
// Cada consulta a Apps Script cuesta ~2 segundos, así que ya no se pide nada por separado:
//  - Al entrar con el PIN se trae TODO en una sola consulta y se guarda en esta "foto" (SNAP).
//  - Después, todas las lecturas (equipos, jugadores, partidos...) salen de la foto al instante.
//  - Cada vez que se guarda algo, el servidor responde con la foto ya actualizada.
//  - Si pasan más de 30 segundos, la siguiente lectura pide una foto nueva (una sola consulta).
//  - Si una LECTURA falla (internet flojo o servidor ocupado), se reintenta sola hasta 3 veces.
//    Los GUARDADOS nunca se reintentan solos, para no duplicar datos.
const SNAP_TTL_MS = 300000;   // 5 minutos (antes 30 segundos): menos esperas al usar el panel del árbitro
const TIMEOUT_LECTURA_MS = 60000;    // una lectura que tarde más se cancela y se reintenta
const TIMEOUT_GUARDADO_MS = 120000;  // los guardados esperan más (una foto puede tardar)
const REINTENTO_BASE_MS = 1200;
let SNAP = null, SNAP_PROMISE = null, SNAP_GEN = 0, SNAP_OFF = false;

function clonar(x) { return x === undefined ? x : JSON.parse(JSON.stringify(x)); }
// Solo detecta el caso real: un servidor VIEJO que todavía no conoce estas dos funciones nuevas.
// (antes esto también atrapaba por error cualquier otro "no permitida", como un pedido cortado a mitad de camino,
// y eso hacía que NO se reintentara y que la entrada rápida se apagara sola para el resto de la sesión)
function sinPermiso(e) { return /Acci[oó]n no permitida: (getTodo|iniciarSesion)\b/i.test((e && e.message) || ''); }
function esperar(ms) { return new Promise(r => setTimeout(r, ms)); }

function rawFull(fn, args, timeoutMs) {
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), timeoutMs || TIMEOUT_LECTURA_MS) : null;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: fn, params: args }),
    signal: ctl ? ctl.signal : undefined
  })
    .then(r => r.text())
    .then(txt => {
      let res;
      try { res = JSON.parse(txt); } catch (e) { throw new Error('El servidor respondió algo inesperado'); }
      if (!res.ok) throw new Error(res.error || 'Error desconocido');
      return res;
    })
    .catch(e => {
      if (e && e.name === 'AbortError') throw new Error('El servidor tardó demasiado en responder');
      throw e;
    })
    .finally(() => { if (timer) clearTimeout(timer); });
}
function rawCall(fn, args, timeoutMs) { return rawFull(fn, args, timeoutMs).then(res => res.data); }

// Repite una LECTURA si falla (hasta 3 intentos, con una pausa creciente entre intentos).
async function conReintento(hacer, onIntento) {
  let ultimo;
  for (let i = 1; i <= 3; i++) {
    if (onIntento) onIntento(i);
    try { return await hacer(); }
    catch (e) {
      ultimo = e;
      if (sinPermiso(e) || i === 3) break;
      await esperar(REINTENTO_BASE_MS * i);
    }
  }
  throw ultimo;
}

function guardarSnapshot(todo) { SNAP = { t: Date.now(), data: todo }; SNAP_PROMISE = null; SNAP_GEN++; }
function invalidarSnapshot() { SNAP = null; SNAP_PROMISE = null; SNAP_GEN++; }

function snapshot() {
  if (SNAP && (Date.now() - SNAP.t) < SNAP_TTL_MS) return Promise.resolve(SNAP.data);
  if (SNAP_PROMISE) return SNAP_PROMISE;
  const gen = SNAP_GEN;
  const p = conReintento(() => rawCall('getTodo', [], TIMEOUT_LECTURA_MS)).then(d => {
    if (gen === SNAP_GEN) SNAP = { t: Date.now(), data: d };
    return d;
  });
  SNAP_PROMISE = p;
  const soltar = () => { if (SNAP_PROMISE === p) SNAP_PROMISE = null; };
  p.then(soltar, soltar);
  return p;
}

// Cómo se obtiene cada lectura a partir de la foto
const LECTURAS = {
  getEquipos:        s => s.equipos,
  getPartidos:       s => s.partidos,
  getJugadoresTodos: s => s.jugadores,
  getJugadores:      (s, equipoId) => s.jugadores.filter(p => String(p.equipoId) === String(equipoId)),
  getTarjetasTodas:  s => s.tarjetas,
  getTarjetas:       (s, matchId) => matchId ? s.tarjetas.filter(t => String(t.matchId) === String(matchId)) : s.tarjetas,
  getGolesTodos:     s => s.goles,
  getGoles:          (s, matchId) => s.goles.filter(g => String(g.matchId) === String(matchId)),
  getCambios:        (s, matchId, equipoId) => s.cambios.filter(c => String(c.matchId) === String(matchId) && String(c.equipoId) === String(equipoId)),
  getAlineacion:     (s, matchId, equipoId) => {
    const a = s.alineaciones.find(x => String(x.matchId) === String(matchId) && String(x.equipoId) === String(equipoId));
    return a ? { titulares: a.titulares, suplentes: a.suplentes, confirmadoEn: a.confirmadoEn } : null;
  }
};
// Acciones que solo leen: no invalidan la foto
const SOLO_LECTURA = new Set([...Object.keys(LECTURAS), 'verificarPin', 'getTodo', 'iniciarSesion']);

function gsCall(fn, ...args) {
  if (LECTURAS[fn] && !SNAP_OFF) {
    return snapshot()
      .then(s => clonar(LECTURAS[fn](s, ...args)))
      .catch(e => {
        // Si el servidor aún no tiene la versión nueva, se usa el modo anterior (consulta por consulta)
        if (sinPermiso(e)) { console.warn('Modo rápido desactivado por:', e.message); SNAP_OFF = true; return rawCall(fn, args); }
        throw e;
      });
  }
  const soloLee = SOLO_LECTURA.has(fn);
  return rawFull(fn, args, soloLee ? TIMEOUT_LECTURA_MS : TIMEOUT_GUARDADO_MS).then(res => {
    if (!soloLee) {
      if (res.todo) guardarSnapshot(res.todo); else invalidarSnapshot();
    }
    return res.data;
  });
}

// Entrar: verifica el PIN y trae todos los datos en la misma consulta
async function iniciarSesionApi(pin, onIntento) {
  if (!SNAP_OFF) {
    try {
      const r = await conReintento(() => rawCall('iniciarSesion', [pin], TIMEOUT_LECTURA_MS), onIntento);
      if (!r) return null;
      guardarSnapshot(r.todo);
      return r.sesion;
    } catch (e) {
      if (!sinPermiso(e)) throw e;
      console.warn('Modo rápido desactivado al entrar, por:', e.message); SNAP_OFF = true;
    }
  }
  return rawCall('verificarPin', [pin]);
}

const POSITIONS = ['Portero','Defensa','Volante','Delantero'];
const RH_TYPES = ['O+','O-','A+','A-','B+','B-','AB+','AB-'];
const CANCHAS = ['Cancha la Agrícola', 'Cancha la Floresta', 'Cancha Unidad Deportiva'];
const STATUS = {
  habilitado: {label:'Habilitado', color:'#2E7D46', bg:'#E7F3EA'},
  suspendido: {label:'Suspendido', color:'#B3261E', bg:'#FBEAE9'},
  lesionado:  {label:'Lesionado',  color:'#B8860B', bg:'#FBF3DC'}
};

function fmtTime(iso){ try { const d=new Date(iso); return d.toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); } catch(e){ return iso; } }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtFechaPartido(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : String(iso);
}
function verFoto(url) {
  if (!url) return;
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.onclick = () => box.remove();
  box.innerHTML = `<img src="${esc(url)}">`;
  document.body.appendChild(box);
}

function resizeImage(file, maxSize=220, quality=0.6){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        const scale = Math.min(1, maxSize/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const app = document.getElementById('app');
let STATE = { tab: null, rol: null, team: null };

function renderPinGate(errorMsg, pinPrevio) {
  document.getElementById('whoami').innerHTML = '';
  app.innerHTML = `<div style="padding-top:24px">
    <h2 class="bebas" style="font-size:34px;margin:0 0 4px">Ingresa tu PIN</h2>
    <p class="sub">El organizador tiene su PIN. Cada equipo tiene el suyo, distinto e independiente. Los árbitros también tienen un PIN propio. Pídele el tuyo al organizador si no lo tienes.</p>
    <div class="card">
      <input id="pinInput" class="pin-input" maxlength="6" inputmode="numeric" placeholder="••••" value="${esc(pinPrevio || '')}">
      <div id="pinError" style="color:#B3261E;font-size:13px;margin-bottom:8px">${errorMsg ? esc(errorMsg) : ''}</div>
      <button class="btn-primary" id="pinBtn" onclick="intentarPin()">Entrar</button>
    </div>
  </div>`;
  document.getElementById('pinInput').focus();
  document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') intentarPin(); });
}

async function intentarPin() {
  const input = document.getElementById('pinInput');
  const btn = document.getElementById('pinBtn');
  const pin = input.value.trim();
  if (!pin || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  const errEl = document.getElementById('pinError');
  if (errEl) errEl.textContent = '';
  let res;
  try {
    res = await iniciarSesionApi(pin, i => { if (i > 1) btn.textContent = 'Reintentando… (' + i + ' de 3)'; });
  } catch (e) {
    console.error('No se pudo entrar:', e);
    renderPinGate('No se pudo conectar. Revisa tu internet e intenta de nuevo. (Detalle: ' + ((e && e.message) || e) + ')', pin);
    return;
  }
  if (!res) { renderPinGate('PIN incorrecto. Intenta de nuevo.'); return; }
  if (res.rol === 'organizador') {
    STATE.rol = 'organizador'; STATE.tab = 'resumen';
    document.getElementById('whoami').innerHTML = '<button onclick="cerrarSesion()">Organizador · salir</button>';
    renderOrg();
  } else if (res.rol === 'arbitro') {
    STATE.rol = 'arbitro'; STATE.tab = 'tarjetas';
    document.getElementById('whoami').innerHTML = '<button onclick="cerrarSesion()">Árbitro · salir</button>';
    renderArbitro();
  } else {
    STATE.rol = 'equipo'; STATE.team = res.equipo; STATE.tab = 'planilla';
    document.getElementById('whoami').innerHTML = `<button onclick="cerrarSesion()">${esc(res.equipo.nombre)} · salir</button>`;
    renderDelegate();
  }
}

function cerrarSesion() { invalidarSnapshot(); STATE = { tab: null, rol: null, team: null }; renderPinGate(); }

// ================= ORGANIZADOR =================
async function renderOrg() {
  const tabs = [['resumen','Resumen'],['equipos','Equipos'],['carnets','Carnets'],['partidos','Partidos'],['tarjetas','Amonestaciones']];
  app.innerHTML = '<div id="content"></div>' + tabBarHtml(tabs, STATE.tab, 'renderOrg');
  const content = document.getElementById('content');
  if (STATE.tab === 'resumen') content.innerHTML = await orgResumenHtml();
  if (STATE.tab === 'equipos') content.innerHTML = await orgEquiposHtml();
  if (STATE.tab === 'carnets') content.innerHTML = await orgCarnetsHtml();
  if (STATE.tab === 'partidos') content.innerHTML = await orgPartidosHtml();
  if (STATE.tab === 'tarjetas') content.innerHTML = await orgTarjetasHtml();
}

function tabBarHtml(tabs, active, renderFn) {
  return '<div class="tabbar">' + tabs.map(([k,l]) =>
    `<button class="${active===k?'active':''}" onclick="STATE.tab='${k}'; ${renderFn}();">${l}</button>`
  ).join('') + '</div>';
}

function descargarTablaPDF(titulo, headers, rows, filename) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(titulo, 14, 15);
  doc.autoTable({ head: [headers], body: rows, startY: 20, styles: { fontSize: 9 }, headStyles: { fillColor: [18, 54, 38] } });
  doc.save(filename);
}

// Un solo PDF con las tres tablas del resumen, una debajo de la otra.
function descargarResumenPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const r = window.__resumen;
  let y = 15;

  doc.setFontSize(14);
  doc.text('Tabla de posiciones', 14, y);
  doc.autoTable({
    head: [['#', 'Equipo', 'PJ', 'Pts', 'GF', 'GC', 'DG', 'TA', 'TR']],
    body: r.posiciones.map((t, i) => [i + 1, t.nombre, t.pj, t.pts, t.gf, t.gc, (t.dg > 0 ? '+' : '') + t.dg, t.ta, t.tr]),
    startY: y + 5, styles: { fontSize: 9 }, headStyles: { fillColor: [18, 54, 38] }
  });
  y = doc.lastAutoTable.finalY + 14;

  doc.setFontSize(14);
  doc.text('Tabla de goleadores', 14, y);
  doc.autoTable({
    head: [['#', 'Jugador', 'Equipo', 'Goles']],
    body: r.goleadores.map((g, i) => [i + 1, g.nombre, g.equipoNombre, g.goles]),
    startY: y + 5, styles: { fontSize: 9 }, headStyles: { fillColor: [18, 54, 38] }
  });
  y = doc.lastAutoTable.finalY + 14;

  doc.setFontSize(14);
  doc.text('Valla menos vencida', 14, y);
  doc.autoTable({
    head: [['#', 'Equipo', 'PJ', 'GC']],
    body: r.valla.map((t, i) => [i + 1, t.nombre, t.pj, t.gc]),
    startY: y + 5, styles: { fontSize: 9 }, headStyles: { fillColor: [18, 54, 38] }
  });

  doc.save('resumen_torneo.pdf');
}

function descargarProgramacionPDF() {
  const fecha = document.getElementById('pdf_fecha_sel').value;
  const nombreDe = window.__nombreEquipoPartidos || {};
  const partidos = Object.values(window.__matchesData || {}).filter(m => String(m.jornada) === String(fecha));
  partidos.sort((a, b) => (a.hora || '').localeCompare(b.hora || ''));
  const headers = ['Local', 'Visitante', 'Día', 'Hora', 'Cancha'];
  const rows = partidos.map(m => [nombreDe[m.equipoA] || '—', nombreDe[m.equipoB] || '—', fmtFechaPartido(m.fecha) || '—', m.hora || '—', m.cancha || '—']);
  descargarTablaPDF('Programación — Fecha ' + fecha, headers, rows, 'fecha_' + fecha + '_programacion.pdf');
}

async function orgResumenHtml() {
  const [teams, matches, tarjetas, golesTodos, players] = await Promise.all([
    gsCall('getEquipos'), gsCall('getPartidos'), gsCall('getTarjetasTodas'),
    gsCall('getGolesTodos'), gsCall('getJugadoresTodos')
  ]);

  // ---- Tabla de posiciones ----
  const statsDe = {};
  teams.forEach(t => { statsDe[t.id] = { id: t.id, nombre: t.nombre, pj: 0, pts: 0, gf: 0, gc: 0, ta: 0, tr: 0 }; });
  matches.forEach(m => {
    const tieneResultado = m.golesA !== '' && m.golesA !== undefined && m.golesA !== null;
    if (!tieneResultado) return;
    const a = statsDe[m.equipoA], b = statsDe[m.equipoB];
    if (!a || !b) return;
    const gA = Number(m.golesA), gB = Number(m.golesB);
    a.pj++; b.pj++;
    a.gf += gA; a.gc += gB;
    b.gf += gB; b.gc += gA;
    if (gA > gB) a.pts += 3;
    else if (gA < gB) b.pts += 3;
    else { a.pts += 1; b.pts += 1; }
  });
  tarjetas.forEach(t => {
    const s = statsDe[t.equipoId];
    if (!s) return;
    if (t.tipo === 'amarilla') s.ta++;
    else if (t.tipo === 'roja') s.tr++;
  });
  const posiciones = Object.values(statsDe).map(s => Object.assign({}, s, { dg: s.gf - s.gc }));
  posiciones.sort((x, y) => (y.pts - x.pts) || (y.dg - x.dg) || ((x.ta + x.tr) - (y.ta + y.tr)));

  // ---- Goleadores ----
  const nombreEquipoDe = {}; teams.forEach(t => nombreEquipoDe[t.id] = t.nombre);
  const nombreJugadorDe = {}; players.forEach(p => nombreJugadorDe[p.id] = p.nombre);
  const golesDe = {};
  golesTodos.forEach(g => {
    if (!golesDe[g.jugadorId]) golesDe[g.jugadorId] = { jugadorId: g.jugadorId, equipoId: g.equipoId, goles: 0 };
    golesDe[g.jugadorId].goles += Number(g.goles) || 0;
  });
  const goleadores = Object.values(golesDe)
    .map(g => Object.assign({}, g, { nombre: nombreJugadorDe[g.jugadorId] || '—', equipoNombre: nombreEquipoDe[g.equipoId] || '—' }))
    .filter(g => g.goles > 0)
    .sort((a, b) => b.goles - a.goles);

  // ---- Valla menos vencida ----
  const valla = posiciones.filter(t => t.pj > 0).slice().sort((a, b) => (a.gc - b.gc) || (a.pj - b.pj));

  window.__resumen = { posiciones, goleadores, valla };

  let html = `<h2 class="bebas">Resumen del torneo</h2><p class="sub">Se actualiza solo, con los resultados, goles y tarjetas que registran los árbitros.</p>`;

  html += `<div class="card">
    <div style="font-weight:600;margin-bottom:8px">Tabla de posiciones</div>`;
  if (posiciones.length === 0) html += '<p class="muted">Aún no hay equipos inscritos.</p>';
  else {
    html += `<div style="overflow-x:auto"><table class="resumen"><thead><tr>
      <th>#</th><th>Equipo</th><th>PJ</th><th>Pts</th><th>GF</th><th>GC</th><th>DG</th><th>TA</th><th>TR</th>
    </tr></thead><tbody>` +
      posiciones.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.nombre)}</td><td>${t.pj}</td><td><strong>${t.pts}</strong></td><td>${t.gf}</td><td>${t.gc}</td><td>${t.dg > 0 ? '+' : ''}${t.dg}</td><td><span class="badge" style="color:#7A4E00;background:#FDECC8">${t.ta}</span></td><td><span class="badge" style="color:#B3261E;background:#FBEAE9">${t.tr}</span></td></tr>`).join('') +
      '</tbody></table></div>';
    html += '<p class="muted" style="margin-top:8px">Desempate en este orden: puntos → diferencia de goles → menos tarjetas (amarillas + rojas).</p>';
  }
  html += '</div>';

  html += `<div class="card">
    <div style="font-weight:600;margin-bottom:8px">Tabla de goleadores</div>`;
  if (goleadores.length === 0) html += '<p class="muted">Aún no hay goles registrados.</p>';
  else {
    html += `<div style="overflow-x:auto"><table class="resumen"><thead><tr><th>#</th><th>Jugador</th><th>Equipo</th><th>Goles</th></tr></thead><tbody>` +
      goleadores.map((g, i) => `<tr><td>${i + 1}</td><td>${esc(g.nombre)}</td><td>${esc(g.equipoNombre)}</td><td><strong>${g.goles}</strong></td></tr>`).join('') +
      '</tbody></table></div>';
  }
  html += '</div>';

  html += `<div class="card">
    <div style="font-weight:600;margin-bottom:8px">Valla menos vencida</div>`;
  if (valla.length === 0) html += '<p class="muted">Aún no hay partidos con resultado registrado.</p>';
  else {
    html += `<div style="overflow-x:auto"><table class="resumen"><thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>GC</th></tr></thead><tbody>` +
      valla.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.nombre)}</td><td>${t.pj}</td><td><strong>${t.gc}</strong></td></tr>`).join('') +
      '</tbody></table></div>';
  }
  html += '</div>';

  html += `<button class="btn-primary" style="width:100%" onclick="descargarResumenPDF()">Descargar resumen en PDF</button>`;

  return html;
}

async function submitMatch() {
  const btn = document.getElementById('matchSubmitBtn');
  if (btn.disabled) return;
  const id = document.getElementById('m_id').value;
  const fecha = document.getElementById('m_fecha').value;
  const hora = document.getElementById('m_hora').value;
  const cancha = document.getElementById('m_cancha').value;
  const jornada = document.getElementById('m_jornada').value;
  const a = document.getElementById('m_a').value, b = document.getElementById('m_b').value;
  if (!id && (!jornada || !a || !b || a===b)) return;
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = 'Guardando…';
  try {
    if (id) {
      const obs = document.getElementById('m_obs').value.trim();
      await gsCall('editarPartido', id, fecha, hora, cancha, obs);
    } else {
      await gsCall('addPartido', Number(jornada), fecha, a, b, hora, cancha);
    }
    renderOrg();
  } catch (e) {
    alert(e && e.message ? e.message : 'No se pudo guardar el partido.');
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
}

async function verPartido(matchId) {
  const [matches, teams] = await Promise.all([gsCall('getPartidos'), gsCall('getEquipos')]);
  const m = matches.find(x => x.id === matchId);
  const teamA = teams.find(t => t.id === m.equipoA), teamB = teams.find(t => t.id === m.equipoB);
  const content = document.getElementById('content');
  content.innerHTML = '<p class="muted">Cargando…</p>';
  const [playersA, playersB, goles] = await Promise.all([gsCall('getJugadores', teamA.id), gsCall('getJugadores', teamB.id), gsCall('getGoles', matchId)]);
  const nombreJugadorDe = {}; [...playersA, ...playersB].forEach(p => nombreJugadorDe[p.id] = p.nombre);
  const tieneResultado = m.golesA !== '' && m.golesA !== undefined && m.golesA !== null;
  let resultadoHtml = `<div class="card" style="text-align:center">`;
  if (tieneResultado) {
    resultadoHtml += `<div class="row" style="justify-content:center;align-items:center;gap:16px">
      <div style="flex:1;text-align:right;font-weight:600">${esc(teamA.nombre)}</div>
      <div class="bebas" style="font-size:32px;color:#123626">${esc(m.golesA)} - ${esc(m.golesB)}</div>
      <div style="flex:1;text-align:left;font-weight:600">${esc(teamB.nombre)}</div>
    </div>`;
  } else {
    resultadoHtml += '<p class="muted">El árbitro aún no registra el resultado.</p>';
  }
  const golesTeam = (equipoId) => goles.filter(g => g.equipoId === equipoId).map(g => `${esc(nombreJugadorDe[g.jugadorId]||'—')} (${esc(g.goles)})`).join(', ');
  if (goles.length) {
    resultadoHtml += `<div style="margin-top:10px;text-align:left;border-top:1px solid #eef1ee;padding-top:8px">
      <div class="muted">Goles ${esc(teamA.nombre)}</div><div style="margin-bottom:6px">${golesTeam(teamA.id)||'—'}</div>
      <div class="muted">Goles ${esc(teamB.nombre)}</div><div>${golesTeam(teamB.id)||'—'}</div>
    </div>`;
  }
  resultadoHtml += '</div>';
  const blockHtml = async (team, players) => {
    const [lu, cambios] = await Promise.all([
      gsCall('getAlineacion', matchId, team.id), gsCall('getCambios', matchId, team.id)
    ]);
    const nombreDe = {}, numeroDe = {}; players.forEach(p => { nombreDe[p.id] = p.nombre; numeroDe[p.id] = p.numero; });
    const listaJugadores = (ids) => ids.map(id => `<div>${esc(numeroDe[id]!=null?numeroDe[id]:'—')} · ${esc(nombreDe[id]||'—')}</div>`).join('');
    let h = `<div class="card"><div style="font-weight:600;margin-bottom:6px">${esc(team.nombre)}</div>`;
    if (!lu) { h += '<p class="muted">El delegado aún no confirma la alineación.</p>'; }
    else {
      h += `<div class="muted">Titulares (${lu.titulares.length})</div><div style="margin-bottom:8px">${listaJugadores(lu.titulares)}</div>`;
      h += `<div class="muted">Suplentes (${lu.suplentes.length})</div><div>${listaJugadores(lu.suplentes) || '—'}</div>`;
    }
    if (cambios.length) {
      h += '<div style="margin-top:10px;border-top:1px solid #eef1ee;padding-top:8px"><div class="muted">Cambios</div>';
      cambios.sort((a,b)=>a.minuto-b.minuto).forEach(c => {
        h += `<div style="font-size:13px">${c.minuto}' — sale ${esc(nombreDe[c.saleId]||'—')}, entra ${esc(nombreDe[c.entraId]||'—')}</div>`;
      });
      h += '</div>';
    }
    h += '</div>';
    return h;
  };
  const [htmlA, htmlB] = await Promise.all([blockHtml(teamA, playersA), blockHtml(teamB, playersB)]);
  content.innerHTML = `<button class="btn-ghost" onclick="renderOrg()">← Volver a partidos</button>
    <h2 class="bebas" style="margin-top:12px">${esc(m.nombre)}</h2><p class="sub">${fmtFechaPartido(m.fecha)}${m.hora?' · '+esc(m.hora):''}${m.cancha?' · 📍 '+esc(m.cancha):''}</p>
    ${m.observaciones?`<p class="muted" style="color:#B8860B">⚠ ${esc(m.observaciones)}</p>`:''}` +
    resultadoHtml + htmlA + htmlB;
}

async function orgTarjetasHtml() {
  const [tarjetas, teams, players, matches] = await Promise.all([gsCall('getTarjetasTodas'), gsCall('getEquipos'), gsCall('getJugadoresTodos'), gsCall('getPartidos')]);
  const nombreEquipoDe = {}; teams.forEach(t => nombreEquipoDe[t.id] = t.nombre);
  const nombreJugadorDe = {}; players.forEach(p => nombreJugadorDe[p.id] = '#' + esc(p.numero) + ' ' + esc(p.nombre));
  const nombrePartidoDe = {}; matches.forEach(m => nombrePartidoDe[m.id] = m.nombre);
  window.__tarjetasData = { tarjetas, teams, nombreEquipoDe, nombreJugadorDe, nombrePartidoDe };

  const estaPagada = t => t.pagada === true || String(t.pagada).toUpperCase() === 'TRUE';
  const totalAmarillas = tarjetas.filter(t => t.tipo === 'amarilla').length;
  const totalRojas = tarjetas.filter(t => t.tipo === 'roja').length;
  const totalPagadas = tarjetas.filter(estaPagada).length;
  const totalPendientes = tarjetas.length - totalPagadas;

  let html = `<h2 class="bebas">Amonestaciones</h2><p class="sub">Tarjetas y sanciones registradas por los árbitros. Solo se puede eliminar una tarjeta después de marcarla como pagada.</p>`;

  html += `<div class="grid2" style="margin-bottom:8px">
    <div class="card" style="text-align:center;padding:10px">
      <div class="muted" style="font-size:12px">Total amarillas</div>
      <div class="bebas" style="font-size:26px;color:#7A4E00">${totalAmarillas}</div>
    </div>
    <div class="card" style="text-align:center;padding:10px">
      <div class="muted" style="font-size:12px">Total rojas</div>
      <div class="bebas" style="font-size:26px;color:#B3261E">${totalRojas}</div>
    </div>
    <div class="card" style="text-align:center;padding:10px">
      <div class="muted" style="font-size:12px">Total pagadas</div>
      <div class="bebas" style="font-size:26px;color:#2E7D46">${totalPagadas}</div>
    </div>
    <div class="card" style="text-align:center;padding:10px">
      <div class="muted" style="font-size:12px">Sin pagar</div>
      <div class="bebas" style="font-size:26px;color:#8a978d">${totalPendientes}</div>
    </div>
  </div>`;

  html += `<select id="tarj_filtro_equipo" onchange="orgTarjetasFiltrar()" style="margin-bottom:10px">
    <option value="">Todos los equipos</option>
    ${teams.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}
  </select>`;

  html += '<div id="tarj_lista">' + tarjetasListaHtml(tarjetas) + '</div>';
  return html;
}

function tarjetasListaHtml(tarjetas) {
  const { nombreEquipoDe, nombreJugadorDe, nombrePartidoDe } = window.__tarjetasData;
  const ordenadas = [...tarjetas].sort((a,b) => new Date(b.ts) - new Date(a.ts));
  if (ordenadas.length === 0) return '<p class="muted">No hay tarjetas para mostrar.</p>';
  return ordenadas.map(t => {
    const color = t.tipo === 'roja' ? {c:'#B3261E', bg:'#FBEAE9', label:'Roja'} : {c:'#7A4E00', bg:'#FDECC8', label:'Amarilla'};
    const pagada = t.pagada === true || String(t.pagada).toUpperCase() === 'TRUE';
    return `<div class="card">
      <div class="row" style="align-items:center">
        <span class="badge" style="color:${color.c};background:${color.bg}">${color.label}</span>
        <div style="flex:1">
          <div style="font-weight:600">${nombreJugadorDe[t.jugadorId] || '—'}</div>
          <div class="muted">${esc(nombreEquipoDe[t.equipoId]||'')} · ${esc(nombrePartidoDe[t.matchId]||'')}</div>
        </div>
      </div>
      ${t.observaciones ? `<div style="margin-top:6px;font-size:14px">${esc(t.observaciones)}</div>` : ''}
      ${t.tipo === 'roja' && t.jornadasSancion ? `<div style="margin-top:6px;font-size:13px;color:#B3261E">Suspensión: ${esc(t.jornadasSancion)} fecha${Number(t.jornadasSancion)===1?'':'s'} desde la fecha ${esc(t.jornada||'—')}</div>` : ''}
      <div class="row" style="margin-top:10px;align-items:center;gap:8px">
        ${pagada
          ? `<span class="badge" style="color:#2E7D46;background:#E3F3E8">Pagada</span><button class="btn-ghost" onclick="orgEliminarTarjeta('${t.id}')">Eliminar</button>`
          : `<span class="badge" style="color:#8a978d;background:#eef1ee">Pendiente de pago</span><button class="btn-primary" onclick="orgPagarTarjeta('${t.id}')">Marcar como pagada</button>`}
      </div>
    </div>`;
  }).join('');
}

function orgTarjetasFiltrar() {
  const equipoId = document.getElementById('tarj_filtro_equipo').value;
  const { tarjetas } = window.__tarjetasData;
  const filtradas = equipoId ? tarjetas.filter(t => String(t.equipoId) === String(equipoId)) : tarjetas;

async function renderDelegate() {
  const tabs = [['planilla','Planilla y carnet'],['partidos','Partidos'],['alineacion','Alineación'],['vivo','En vivo']];
  app.innerHTML = '<div id="content"></div>' + tabBarHtml(tabs, STATE.tab, 'renderDelegate');
  const content = document.getElementById('content');
  if (STATE.tab === 'planilla') content.innerHTML = await planillaHtml();
  if (STATE.tab === 'partidos') content.innerHTML = await delegatePartidosHtml();
  if (STATE.tab === 'alineacion') await alineacionRender(content);
  if (STATE.tab === 'vivo') await enVivoRender(content);
}

async function delegatePartidosHtml() {
  const [matches, teams] = await Promise.all([gsCall('getPartidos'), gsCall('getEquipos')]);
  const misPartidos = matches.filter(m => m.equipoA === STATE.team.id || m.equipoB === STATE.team.id)
    .sort((a, b) => (Number(a.jornada) || 0) - (Number(b.jornada) || 0));
  const nombreEquipoDe = {}; teams.forEach(t => nombreEquipoDe[t.id] = t.nombre);
  let html = `<h2 class="bebas">Partidos — ${esc(STATE.team.nombre)}</h2><p class="sub">Elige una fecha para ver el resultado y los detalles registrados por el árbitro.</p>`;
  if (misPartidos.length === 0) html += '<p class="muted">Aún no tienes partidos programados.</p>';
  misPartidos.forEach(m => {
    const rival = m.equipoA === STATE.team.id ? nombreEquipoDe[m.equipoB] : nombreEquipoDe[m.equipoA];
    const tieneResultado = m.golesA !== '' && m.golesA !== undefined && m.golesA !== null;
    let marcador = '';
    if (tieneResultado) {
      const misGoles = m.equipoA === STATE.team.id ? m.golesA : m.golesB;
      const golesRival = m.equipoA === STATE.team.id ? m.golesB : m.golesA;
      marcador = `${esc(misGoles)} - ${esc(golesRival)}`;
    }
    html += `<div class="card row" style="cursor:pointer;align-items:center" onclick="verPartidoDelegado('${m.id}')">
      <div style="flex:1">
        <div style="font-weight:600">${esc(m.nombre)}</div>
        <div class="muted">vs ${esc(rival||'—')}${m.fecha?' · '+fmtFechaPartido(m.fecha):''}${m.hora?' · '+esc(m.hora):''}</div>
        ${m.cancha?`<div class="muted">📍 ${esc(m.cancha)}</div>`:''}
        ${m.observaciones?`<div class="muted" style="color:#B8860B">⚠ ${esc(m.observaciones)}</div>`:''}
      </div>
      ${tieneResultado ? `<div class="bebas" style="font-size:20px;color:#123626">${marcador}</div>` : '<span class="badge" style="color:#8a978d;background:#eef1ee">Sin jugar</span>'}
    </div>`;
  });

  html += await asistenciaHtml(misPartidos);
  return html;
}

// Cuenta, para cada jugador del equipo, en cuántas fechas YA JUGADAS estuvo en la alineación confirmada
// (titular o suplente). No usa fotos a propósito, para que cargue rápido con equipos grandes.
async function asistenciaHtml(misPartidos) {
  const jugados = misPartidos.filter(m => m.golesA !== '' && m.golesA !== undefined && m.golesA !== null);
  const players = await gsCall('getJugadores', STATE.team.id);
  const conteo = {}; players.forEach(p => { conteo[p.id] = 0; });
  for (const m of jugados) {
    const lu = await gsCall('getAlineacion', m.id, STATE.team.id);
    if (!lu) continue;
    new Set([...lu.titulares, ...lu.suplentes]).forEach(id => { if (conteo[id] !== undefined) conteo[id]++; });
  }
  const filas = players
    .map(p => ({ nombre: p.nombre, numero: p.numero, veces: conteo[p.id] || 0 }))
    .sort((a, b) => b.veces - a.veces || a.nombre.localeCompare(b.nombre));

  return `<div class="card" style="padding:0;margin-top:12px">
    <div class="row" style="padding:12px;cursor:pointer" onclick="toggleAsistencia()">
      <div style="flex:1;font-weight:600">Asistencia por partido</div>
      <div id="asis_flecha" class="muted" style="font-size:18px">▾</div>
    </div>
    <div id="asis_body" style="display:none;padding:0 12px 12px 12px">
      <p class="muted" style="margin-top:0">Fechas ya jugadas (con resultado) en las que cada jugador estuvo en la alineación confirmada, de ${jugados.length} fecha${jugados.length===1?'':'s'} jugada${jugados.length===1?'':'s'} en total.</p>
      ${players.length === 0 ? '<p class="muted">Este equipo aún no tiene jugadores.</p>' : `
      <div style="overflow-x:auto"><table class="resumen"><thead><tr><th style="text-align:left">Jugador</th><th>Fechas jugadas</th></tr></thead><tbody>
        ${filas.map(f => `<tr><td style="text-align:left">#${esc(f.numero)} ${esc(f.nombre)}</td><td><strong>${f.veces}</strong></td></tr>`).join('')}
      </tbody></table></div>`}
    </div>
  </div>`;
}

function toggleAsistencia() {
  const body = document.getElementById('asis_body');
  const flecha = document.getElementById('asis_flecha');
  const abierto = body.style.display !== 'none';
  body.style.display = abierto ? 'none' : 'block';
  flecha.textContent = abierto ? '▾' : '▴';
}

async function verPartidoDelegado(matchId) {
  const content = document.getElementById('content');
  content.innerHTML = '<p class="muted">Cargando…</p>';
  const [matches, teams] = await Promise.all([gsCall('getPartidos'), gsCall('getEquipos')]);
  const m = matches.find(x => x.id === matchId);
  const teamA = teams.find(t => t.id === m.equipoA), teamB = teams.find(t => t.id === m.equipoB);
  const [playersA, playersB, goles] = await Promise.all([gsCall('getJugadores', teamA.id), gsCall('getJugadores', teamB.id), gsCall('getGoles', matchId)]);
  const nombreJugadorDe = {}; [...playersA, ...playersB].forEach(p => nombreJugadorDe[p.id] = p.nombre);
  const tieneResultado = m.golesA !== '' && m.golesA !== undefined && m.golesA !== null;
  let resultadoHtml = `<div class="card" style="text-align:center">`;
  if (tieneResultado) {
    resultadoHtml += `<div class="row" style="justify-content:center;align-items:center;gap:16px">
      <div style="flex:1;text-align:right;font-weight:600">${esc(teamA.nombre)}</div>
      <div class="bebas" style="font-size:32px;color:#123626">${esc(m.golesA)} - ${esc(m.golesB)}</div>
      <div style="flex:1;text-align:left;font-weight:600">${esc(teamB.nombre)}</div>
    </div>`;
  } else {
    resultadoHtml += '<p class="muted">El árbitro aún no registra el resultado de este partido.</p>';
  }
  const golesTeam = (equipoId) => goles.filter(g => g.equipoId === equipoId).map(g => `${esc(nombreJugadorDe[g.jugadorId]||'—')} (${esc(g.goles)})`).join(', ');
  if (goles.length) {
    resultadoHtml += `<div style="margin-top:10px;text-align:left;border-top:1px solid #eef1ee;padding-top:8px">
      <div class="muted">Goles ${esc(teamA.nombre)}</div><div style="margin-bottom:6px">${golesTeam(teamA.id)||'—'}</div>
      <div class="muted">Goles ${esc(teamB.nombre)}</div><div>${golesTeam(teamB.id)||'—'}</div>
    </div>`;
  }
  resultadoHtml += '</div>';
  const blockHtml = async (team, players) => {
    const [lu, cambios] = await Promise.all([
      gsCall('getAlineacion', matchId, team.id), gsCall('getCambios', matchId, team.id)
    ]);
    const nombreDe = {}, numeroDe = {}; players.forEach(p => { nombreDe[p.id] = p.nombre; numeroDe[p.id] = p.numero; });
    const listaJugadores = (ids) => ids.map(id => `<div>${esc(numeroDe[id]!=null?numeroDe[id]:'—')} · ${esc(nombreDe[id]||'—')}</div>`).join('');
    let h = `<div class="card"><div style="font-weight:600;margin-bottom:6px">${esc(team.nombre)}</div>`;
    if (!lu) { h += '<p class="muted">Alineación no confirmada.</p>'; }
    else {
      h += `<div class="muted">Titulares (${lu.titulares.length})</div><div style="margin-bottom:8px">${listaJugadores(lu.titulares)}</div>`;
      h += `<div class="muted">Suplentes (${lu.suplentes.length})</div><div>${listaJugadores(lu.suplentes) || '—'}</div>`;
    }
    if (cambios.length) {
      h += '<div style="margin-top:10px;border-top:1px solid #eef1ee;padding-top:8px"><div class="muted">Cambios</div>';
      cambios.sort((a,b)=>a.minuto-b.minuto).forEach(c => {
        h += `<div style="font-size:13px">${c.minuto}' — sale ${esc(nombreDe[c.saleId]||'—')}, entra ${esc(nombreDe[c.entraId]||'—')}</div>`;
      });
      h += '</div>';
    }
    h += '</div>';
    return h;
  };
  const [htmlA, htmlB] = await Promise.all([blockHtml(teamA, playersA), blockHtml(teamB, playersB)]);
  content.innerHTML = `<button class="btn-ghost" onclick="renderDelegate()">← Volver a partidos</button>
    <h2 class="bebas" style="margin-top:12px">${esc(m.nombre)}</h2><p class="sub">${fmtFechaPartido(m.fecha)}${m.hora?' · '+esc(m.hora):''}${m.cancha?' · 📍 '+esc(m.cancha):''}</p>
    ${m.observaciones?`<p class="muted" style="color:#B8860B">⚠ ${esc(m.observaciones)}</p>`:''}` +
    resultadoHtml + htmlA + htmlB;
}

async function editPlayer(id) {
  const players = await gsCall('getJugadores', STATE.team.id);
  const p = players.find(x => x.id === id);
  editingId = id; currentPhoto = null;
  document.getElementById('p_nombre').value = p.nombre;
  document.getElementById('p_doc').value = p.docId;
  document.getElementById('p_nac').value = p.nacimiento;
  document.getElementById('p_rh').value = p.rh || '';
  document.getElementById('p_num').value = p.numero;
  document.getElementById('p_pos').value = p.posicion;
  document.getElementById('p_estado').value = p.estado;

let alTitulares = [], alSuplentes = [];
async function alineacionCargar() {
  const matchId = document.getElementById('al_match').value;
  const body = document.getElementById('al_body');
  if (!matchId) { body.innerHTML = ''; return; }
  const lu = await gsCall('getAlineacion', matchId, STATE.team.id);
  alTitulares = lu ? lu.titulares : [];
  alSuplentes = lu ? lu.suplentes : [];
  window.__alTarjetas = await gsCall('getTarjetasTodas');
  const match = (window.__alMatches || []).find(m => m.id === matchId);
  window.__alJornadaActual = (match && match.jornada !== '' && match.jornada != null) ? Number(match.jornada) : null;
  alineacionRedibujar(matchId, !!lu);
}

// Revisa si un jugador puede alinearse: sin tarjetas pendientes de pago, y sin suspensión activa por roja
function estadoTarjetaJugador(jugadorId) {
  const jornadaActual = window.__alJornadaActual;
  const tarjetas = (window.__alTarjetas || []).filter(t => t.jugadorId === jugadorId);
  for (const t of tarjetas) {
    const pagada = t.pagada === true || String(t.pagada).toUpperCase() === 'TRUE';
    if (!pagada) {
      return { bloqueado: true, motivo: `Tarjeta ${t.tipo} pendiente de pago` };
    }
    if (t.tipo === 'roja' && jornadaActual != null && t.jornada !== '' && t.jornada != null) {
      const cardJornada = Number(t.jornada);
      const sancion = Number(t.jornadasSancion) || 0;
      const bloqueadoHasta = cardJornada + sancion - 1;
      if (sancion > 0 && jornadaActual > cardJornada && jornadaActual <= bloqueadoHasta) {
        return { bloqueado: true, motivo: `Suspendido por roja hasta que pase la fecha ${bloqueadoHasta}` };
      }
    }
  }
  return { bloqueado: false, motivo: '' };
}

function alineacionRedibujar(matchId, confirmed) {
  const body = document.getElementById('al_body');
  const players = window.__alPlayers;
  window.__alHabilitados = {};
  let html = `<div class="muted" style="margin:10px 0">Titulares: ${alTitulares.length}/11 · Suplentes: ${alSuplentes.length}</div>`;
  if (players.length === 0) html += '<p class="muted">Agrega jugadores en Planilla primero.</p>';
  players.forEach(p => {
    const isT = alTitulares.includes(p.id), isS = alSuplentes.includes(p.id);
    const autorizado = p.autorizado === true || String(p.autorizado).toUpperCase() === 'TRUE';
    const est = estadoTarjetaJugador(p.id);
    const habilitado = autorizado && !est.bloqueado;
    window.__alHabilitados[p.id] = habilitado;
    let motivo = '';
    if (!autorizado) motivo = 'Pendiente de autorización del organizador';
    else if (est.bloqueado) motivo = est.motivo;
    html += `<div class="card row" style="padding:10px">
      <div style="flex:1;font-size:14px">#${esc(p.numero)} ${esc(p.nombre)} <span class="muted">· ${esc(p.posicion)}</span>${motivo?`<div class="muted" style="color:#B8860B">${esc(motivo)}</div>`:''}</div>
      <button class="toggle ${isT?'on-t':''}" ${habilitado?'':'disabled'} onclick="alToggle('t','${p.id}','${matchId}',${confirmed})">Titular</button>
      <button class="toggle ${isS?'on-s':''}" ${habilitado?'':'disabled'} onclick="alToggle('s','${p.id}','${matchId}',${confirmed})">Suplente</button>
    </div>`;
  });
  html += `<button class="btn-primary" style="margin-top:8px" onclick="alConfirmar('${matchId}')">${confirmed?'Actualizar alineación confirmada':'Confirmar alineación'}</button>`;
  if (confirmed) html += '<p style="color:#3F7D58;font-size:12px;margin-top:6px">✓ El organizador fue notificado.</p>';
  body.innerHTML = html;
}
function alToggle(kind, id, matchId, confirmed) {
  const habilitado = (window.__alHabilitados || {})[id];
  if (!habilitado) return;
  if (kind === 't') {
    if (alTitulares.includes(id)) alTitulares = alTitulares.filter(x=>x!==id);
    else if (!alSuplentes.includes(id) && alTitulares.length < 11) alTitulares.push(id);
  } else {
    if (alSuplentes.includes(id)) alSuplentes = alSuplentes.filter(x=>x!==id);
    else if (!alTitulares.includes(id)) alSuplentes.push(id);
  }
  alineacionRedibujar(matchId, confirmed);
}
async function alConfirmar(matchId) {
  const matches = await gsCall('getPartidos');
  const m = matches.find(x => x.id === matchId);
  await gsCall('guardarAlineacion', matchId, STATE.team.id, alTitulares, alSuplentes, STATE.team.nombre, m.nombre);
  alineacionRedibujar(matchId, true);
}

  const [allMatches, teams] = await Promise.all([gsCall('getPartidos'), gsCall('getEquipos')]);

    <div id="ev_body"></div>`;

async function enVivoCargar() {
  const matchId = document.getElementById('ev_match').value;
  const body = document.getElementById('ev_body');
  if (!matchId) { body.innerHTML=''; return; }
  const partido = (window.__evMatches || []).find(m => m.id === matchId);
  const yaJugado = partido && partido.golesA !== '' && partido.golesA !== undefined && partido.golesA !== null;
  if (yaJugado) {
    body.innerHTML = `<div class="card" style="text-align:center;padding:20px">
      <div style="font-size:32px;margin-bottom:8px">🏁</div>
      <div style="font-weight:600;margin-bottom:4px">Este partido ya se jugó</div>
      <p class="muted" style="margin:0">El árbitro ya registró el resultado final, así que no se pueden hacer más cambios aquí.
      Ve a la pestaña <strong>Partidos</strong> para ver el resultado, la alineación y los cambios de este partido.</p>
    </div>`;
    return;
  }
  const lu = await gsCall('getAlineacion', matchId, STATE.team.id);
  if (!lu) { body.innerHTML = '<p class="muted">Primero confirma la alineación titular en la pestaña Alineación.</p>'; return; }
  const players = await gsCall('getJugadores', STATE.team.id);
  const log = await gsCall('getCambios', matchId, STATE.team.id);
  const nombreDe = {}, cuarentonDe = {};
  players.forEach(p=>{ nombreDe[p.id]=p.nombre; cuarentonDe[p.id]=!!p.cuarenton; });

  // Reproducimos los cambios en orden cronológico para saber quién está en cancha en este momento
  const eventos = [...log].sort((a,b)=> (a.minuto-b.minuto) || (new Date(a.ts)-new Date(b.ts)));
  const enCancha = new Set(lu.titulares);
  const yaEntroAlgunaVez = new Set(); // suplentes que ya usaron su entrada (para bloquear reingreso, salvo cuarentón)
  eventos.forEach(c => {
    enCancha.delete(c.saleId);
    enCancha.add(c.entraId);
    if (lu.suplentes.includes(c.entraId)) yaEntroAlgunaVez.add(c.entraId);
  });

  // Sale: cualquiera que esté actualmente en cancha (titular o suplente que entró)
  const disponibles = [...enCancha];

  // Entra: suplentes que no están en cancha y (nunca han entrado, o son cuarentón y pueden reingresar)
  const banca = lu.suplentes.filter(id => !enCancha.has(id) && (cuarentonDe[id] || !yaEntroAlgunaVez.has(id)));
  // Además, un titular cuarentón que ya salió también puede volver a entrar (los titulares normales no)
  const titularesReingresan = lu.titulares.filter(id => !enCancha.has(id) && cuarentonDe[id]);
  const puedenEntrar = [...banca, ...titularesReingresan];
  let html = `<div class="card">
    <div class="muted" style="margin-bottom:8px">Registrar cambio</div>
    <select id="ev_out"><option value="">Sale…</option>${disponibles.map(id=>`<option value="${id}">${esc(nombreDe[id]||'—')}</option>`).join('')}</select>
    <select id="ev_in"><option value="">Entra…</option>${puedenEntrar.map(id=>`<option value="${id}">${esc(nombreDe[id]||'—')}${cuarentonDe[id]?' (cuarentón)':''}</option>`).join('')}</select>
    <input id="ev_min" type="number" placeholder="Minuto">
    <button class="btn-primary" id="ev_btn_registrar" onclick="enVivoRegistrar('${matchId}')">Registrar cambio</button>
  </div>
  <div class="muted" style="margin:10px 0 6px">Historial del partido</div>`;
  if (log.length === 0) html += '<p class="muted">Sin cambios registrados aún.</p>';
  log.sort((a,b)=>a.minuto-b.minuto).forEach(c => {
    html += `<div class="card">${c.minuto}' — sale ${esc(nombreDe[c.saleId]||'—')}, entra ${esc(nombreDe[c.entraId]||'—')}</div>`;
  });
  body.innerHTML = html;
}
async function enVivoRegistrar(matchId) {
  const outId = document.getElementById('ev_out').value, inId = document.getElementById('ev_in').value, minuto = document.getElementById('ev_min').value;
  if (!outId || !inId || !minuto) return;
  const btn = document.getElementById('ev_btn_registrar');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Registrando…';
  try {
    // las dos lecturas ya no se esperan una tras otra: se piden a la vez (ambas salen de la memoria, instantáneas)
    const [players, matches] = await Promise.all([gsCall('getJugadores', STATE.team.id), gsCall('getPartidos')]);
    const nombreDe = {}; players.forEach(p=>nombreDe[p.id]=p.nombre);
    const m = matches.find(x=>x.id===matchId);
    await gsCall('addCambio', matchId, STATE.team.id, outId, inId, Number(minuto), STATE.team.nombre, m.nombre, nombreDe[outId], nombreDe[inId]);
    enVivoCargar();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Registrar cambio';
    alert(e && e.message ? e.message : 'No se pudo registrar el cambio.');
  }
}

async function arbitroGuardarResultado() {

  const m = window.__arMatch;

    btn.disabled = false;
    btn.textContent = textoOriginal;
    alert(e && e.message ? e.message : 'No se pudo guardar el resultado.');

// Solo se envían al servidor los goles que el árbitro cambió (antes se enviaban todos los jugadores, uno por uno).
async function arbitroGuardarGoles() {
  const btn = document.getElementById('ar_btn_goles');
  if (btn.disabled) return;   // evita el doble clic mientras se está guardando
  const teamA = window.__arTeams.a, teamB = window.__arTeams.b, m = window.__arMatch;
  const [playersA, playersB] = await Promise.all([gsCall('getJugadores', teamA.id), gsCall('getJugadores', teamB.id)]);
  const base = window.__arGolesBase || {};
  // Se juntan primero TODOS los cambios y se mandan en un solo pedido al servidor,
  // en vez de uno por jugador (eso era lo que hacía que "Guardando…" se quedara pegado un buen rato).
  const cambios = [];
  for (const [team, players] of [[teamA, playersA], [teamB, playersB]]) {
    for (const p of players) {
      const el = document.getElementById('gol_' + p.id);
      if (!el) continue;
      const nuevo = Number(el.value) || 0;
      if (nuevo !== (base[p.id] || 0)) cambios.push([p.id, team.id, nuevo]);
    }
  }
  if (cambios.length > 0) {
    btn.disabled = true;
    const textoOriginal = btn.textContent;
    btn.textContent = 'Guardando…';
    try {
      await gsCall('guardarGolesLote', m.id, cambios);
      alert('Goles guardados.');
    } catch (e) {
      btn.disabled = false;
      btn.textContent = textoOriginal;
      alert(e && e.message ? e.message : 'No se pudieron guardar los goles.');
    }
  } else {
    alert('No hay cambios en los goles.');
  }
  await arbitroRedibujar();   // redibuja el panel completo: el botón de goles vuelve a nacer normal
}

async function arbitroCargarJugadores() {
  const equipoId = document.getElementById('ar_equipo').value;
  const lista = document.getElementById('ar_jugador_lista');
  document.getElementById('ar_jugador').value = '';
  if (!equipoId) { lista.className = 'muted'; lista.innerHTML = 'Elige primero el equipo…'; return; }
  lista.className = 'muted'; lista.innerHTML = 'Cargando…';
  const players = await gsCall('getJugadores', equipoId);
  lista.className = 'stack';
  if (players.length === 0) { lista.className = 'muted'; lista.innerHTML = 'Este equipo no tiene jugadores registrados.'; return; }
  lista.innerHTML = players.map(p => `<div class="card row" id="arp_${p.id}" style="cursor:pointer;align-items:center;padding:8px" onclick="arbitroSeleccionarJugador('${p.id}')">
    <div class="photo" style="width:44px;height:44px">${p.fotoUrl ? `<img src="${esc(p.fotoUrl)}">` : ''}</div>
    <div style="flex:1">
      <div style="font-weight:600;font-size:14px">${esc(p.nombre)}</div>
      <div class="muted">#${esc(p.numero)} · ${esc(p.posicion)}</div>
    </div>
  </div>`).join('');
}

function arbitroSeleccionarJugador(id) {
  document.getElementById('ar_jugador').value = id;
  document.querySelectorAll('#ar_jugador_lista .card').forEach(el => {
    el.style.border = el.id === 'arp_' + id ? '2px solid #123626' : '1px solid transparent';
  });
}

async function arbitroRegistrar() {
  const btn = document.getElementById('ar_btn_tarjeta');
  if (btn.disabled) return;   // evita el doble clic mientras se está guardando (por eso se duplicaban las tarjetas)
  const m = window.__arMatch, teams = window.__arTeams;
  const equipoId = document.getElementById('ar_equipo').value;
  const jugadorId = document.getElementById('ar_jugador').value;
  const tipo = document.getElementById('ar_tipo').value;
  const obs = document.getElementById('ar_obs').value.trim();
  const sancion = document.getElementById('ar_sancion').value;
  if (!equipoId || !jugadorId) return;
  if (tipo === 'roja' && !sancion) { alert('Indica cuántas fechas de suspensión lleva la tarjeta roja.'); return; }
  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = 'Guardando…';
  try {
    const team = (teams.a.id === equipoId) ? teams.a : teams.b;
    const players = await gsCall('getJugadores', equipoId);
    const jugador = players.find(p => p.id === jugadorId);
    await gsCall('addTarjeta', m.id, equipoId, jugadorId, tipo, obs, team.nombre, jugador ? jugador.nombre : '', m.nombre, m.jornada, sancion ? Number(sancion) : 0);
    await arbitroRedibujar();   // redibuja todo el panel: el botón vuelve a nacer normal, listo para la siguiente tarjeta
  } catch (e) {
    btn.disabled = false;
    btn.textContent = textoOriginal;
    alert(e && e.message ? e.message : 'No se pudo registrar la tarjeta.');
  }
}

function tarjetaCardHtml(t, nombreEquipoDe, nombreJugadorDe) {
  const color = t.tipo === 'roja' ? {c:'#B3261E', bg:'#FBEAE9', label:'Roja'} : {c:'#7A4E00', bg:'#FDECC8', label:'Amarilla'};
  const pagada = t.pagada === true || String(t.pagada).toUpperCase() === 'TRUE';
  return `<div class="card">
    <div class="row" style="align-items:center">
      <span class="badge" style="color:${color.c};background:${color.bg}">${color.label}</span>
      <div style="flex:1">
        <div style="font-weight:600">${nombreJugadorDe[t.jugadorId] || '—'}</div>
        <div class="muted">${esc(nombreEquipoDe[t.equipoId]||'')}</div>
      </div>
    </div>
    ${t.observaciones ? `<div style="margin-top:6px;font-size:14px">${esc(t.observaciones)}</div>` : ''}
    ${t.tipo === 'roja' && t.jornadasSancion ? `<div style="margin-top:6px;font-size:13px;color:#B3261E">Suspensión: ${esc(t.jornadasSancion)} fecha${Number(t.jornadasSancion)===1?'':'s'} desde la fecha ${esc(t.jornada||'—')}</div>` : ''}
    <div style="margin-top:8px">${pagada
      ? '<span class="badge" style="color:#2E7D46;background:#E3F3E8">Pagada</span>'
      : '<span class="badge" style="color:#8a978d;background:#eef1ee">Pendiente de pago</span>'}</div>
  </div>`;
}
