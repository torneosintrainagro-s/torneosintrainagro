      <div class="row" style="justify-content:center;align-items:center;gap:16px">
        <div style="flex:1;text-align:right;font-weight:600">${esc(teamA.nombre)}</div>
        <div class="bebas" style="font-size:32px;color:#123626">${tieneResultado ? esc(m.golesA) + ' - ' + esc(m.golesB) : '— - —'}</div>
        <div style="flex:1;text-align:left;font-weight:600">${esc(teamB.nombre)}</div>
      </div>
      ${m.arbitroNombre ? `<div class="muted" style="margin-top:6px">Árbitro: ${esc(m.arbitroNombre)}</div>` : ''}
      ${lineaW(m, nombreEquipoDe)}
    </div>
    <div class="card"><div class="muted" style="margin-bottom:4px">Goles por jugador</div>
      ${bloqueGolesEquipo(teamA, playersA, 'LOCAL', '#123626', '#EEF3ED', golesGuardados, true)}
      ${bloqueGolesEquipo(teamB, playersB, 'VISITANTE', '#0B5FA5', '#EAF2FB', golesGuardados, true)}
    </div>
    <div class="muted" style="margin:14px 0 6px">Tarjetas de este partido</div>`;
    if (tarjetas.length === 0) html += '<p class="muted">No hubo tarjetas en este partido.</p>';
    tarjetas.slice().reverse().forEach(t => { html += tarjetaCardHtml(t, nombreEquipoDe, nombreJugadorDe); });
    body.innerHTML = html;
    return;
  }

  // ---------- Partido abierto: se trabaja sobre el borrador del celular ----------
  let b = leerBorrador(m.id);
  if (!b) {
    b = {
      matchId: m.id,
      golesA: tieneResultado ? String(m.golesA) : '',
      golesB: tieneResultado ? String(m.golesB) : '',
      arbitro: m.arbitroNombre || '',
      goles: golesGuardados,
      tarjetas: []
    };
  }
  window.__arBorrador = b;
  guardarBorrador();

  html += `<div class="card" style="background:#FBF3DC;font-size:14px">
    📝 Llena el marcador, los goles por jugador y las tarjetas. <strong>Nada se guarda hasta que toques el botón verde del final</strong>,
    "Guardar y finalizar partido". Lo que escribas queda guardado en este celular, aunque se vaya el internet.
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px">Nombre del árbitro</div>
    <input type="text" id="ar_nombre_arbitro" value="${esc(b.arbitro)}" oninput="arCampo('arbitro', this.value)" placeholder="Quién está calificando este partido" style="width:100%">
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px">Resultado del partido</div>
    <div class="row" style="align-items:center;gap:10px">
      <div style="flex:1;font-size:13px;font-weight:600">${esc(teamA.nombre)}</div>
      <input type="number" min="0" inputmode="numeric" id="ar_golesA" value="${esc(b.golesA)}" oninput="arCampo('golesA', this.value)" style="width:70px;text-align:center;margin:0">
      <div class="bebas" style="font-size:20px">-</div>
      <input type="number" min="0" inputmode="numeric" id="ar_golesB" value="${esc(b.golesB)}" oninput="arCampo('golesB', this.value)" style="width:70px;text-align:center;margin:0">
      <div style="flex:1;font-size:13px;font-weight:600;text-align:right">${esc(teamB.nombre)}</div>
    </div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:4px">Goles por jugador</div>
    ${bloqueGolesEquipo(teamA, playersA, 'LOCAL', '#123626', '#EEF3ED', b.goles, false)}
    ${bloqueGolesEquipo(teamB, playersB, 'VISITANTE', '#0B5FA5', '#EAF2FB', b.goles, false)}
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px">Agregar amonestación</div>
    <input type="hidden" id="ar_tipo" value="amarilla">
    <div class="row" style="gap:8px;margin-bottom:10px">
      <button id="ar_tipo_amarilla" class="btn-ghost" style="flex:1" onclick="arElegirTipo('amarilla')">🟨 Amarilla</button>
      <button id="ar_tipo_roja" class="btn-ghost" style="flex:1" onclick="arElegirTipo('roja')">🟥 Roja</button>
    </div>
    <select id="ar_equipo" onchange="arbitroCargarJugadores()">
      <option value="">Elige el equipo…</option>
      <option value="${teamA.id}">${esc(teamA.nombre)}</option>
      <option value="${teamB.id}">${esc(teamB.nombre)}</option>
    </select>
    <div class="muted" id="ar_jug_titulo" style="margin:4px 0 6px">Jugadores (toca todos los que recibieron amarilla)</div>
    <input type="hidden" id="ar_jugador" value="">
    <div id="ar_jugador_lista" class="muted" style="margin-bottom:10px">Elige primero el equipo…</div>
    <div id="ar_obs_wrap" style="display:none">
      <p class="muted" style="margin:4px 0 6px;font-size:13px">Escribe el motivo de la roja. El organizador decide después cuántas fechas de suspensión lleva.</p>
      <textarea id="ar_obs" rows="3" placeholder="Observaciones (motivo, detalle de la falta, etc.)" style="width:100%;padding:12px;border-radius:8px;border:1px solid #d8ded8;font-family:inherit;font-size:16px;margin-bottom:8px"></textarea>
    </div>
    <button class="btn-ghost" id="ar_btn_agregar" style="width:100%" onclick="arbitroAgregarTarjeta()">+ Agregar a la lista</button>
  </div>

  <div class="muted" style="margin:14px 0 6px">Tarjetas de este partido</div>
  <div id="ar_lista_tarjetas"></div>

  <div class="card" style="margin-top:16px;border:2px solid #2E7D46">
    <button class="btn-primary" id="ar_btn_final" style="width:100%;background:#2E7D46;font-size:18px;padding:16px" onclick="arbitroGuardarYFinalizar()">✅ Guardar y finalizar partido</button>
    <div id="ar_final_error" style="color:#B3261E;font-size:14px;margin-top:8px"></div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">Guarda el marcador, los goleadores y las tarjetas, todo de una vez, y cierra el partido.</p>
  </div>`;

  body.innerHTML = html;
  window.__arSeleccion = [];
  arElegirTipo('amarilla');
  arPintarTarjetas();
}

// Pinta solo la lista de tarjetas (no toca el marcador ni los goles que ya están escritos)
function arPintarTarjetas() {
  const cont = document.getElementById('ar_lista_tarjetas'); if (!cont) return;
  const b = window.__arBorrador || { tarjetas: [] };
  const nj = window.__arNombreJugadorDe || {}, ne = window.__arNombreEquipoDeT || {};
  const guardadas = window.__arTarjetasGuardadas || [];
  let h = '';
  if (b.tarjetas.length === 0 && guardadas.length === 0) h = '<p class="muted">Aún no hay tarjetas en este partido.</p>';
  b.tarjetas.slice().reverse().forEach(t => {
    const roja = t.tipo === 'roja';
    h += `<div class="card" style="border:1px dashed #B8860B">
      <div class="row" style="align-items:center">
        <span class="badge" style="color:${roja?'#B3261E':'#7A4E00'};background:${roja?'#FBEAE9':'#FDECC8'}">${roja?'Roja':'Amarilla'}</span>
        <div style="flex:1">
          <div style="font-weight:600">${nj[t.jugadorId] || '—'}</div>
          <div class="muted">${esc(ne[t.equipoId] || '')}</div>
        </div>
        <button class="btn-ghost" style="padding:8px 12px;color:#B3261E" onclick="arQuitarTarjeta('${t.id}')">✕</button>
      </div>
      ${t.observaciones ? `<div style="margin-top:6px;font-size:14px">${esc(t.observaciones)}</div>` : ''}
      <div style="margin-top:6px"><span class="badge" style="color:#B8860B;background:#FBF3DC">Por guardar</span></div>
    </div>`;
  });
  guardadas.slice().reverse().forEach(t => { h += tarjetaCardHtml(t, ne, nj); });
  cont.innerHTML = h;
}

function arbitroAgregarTarjeta() {
  const b = window.__arBorrador; if (!b) return;
  const equipoId = document.getElementById('ar_equipo').value;
  const tipo = arTipoActual();
  const seleccion = [...window.__arSeleccion];
  if (!equipoId || seleccion.length === 0) { alert(tipo === 'roja' ? 'Elige el equipo y el jugador expulsado.' : 'Elige el equipo y toca los jugadores que recibieron amarilla.'); return; }
  const obs = tipo === 'roja' ? document.getElementById('ar_obs').value.trim().toUpperCase() : '';

  // Aviso si alguno ya tiene amarilla en este partido (por si es la segunda amarilla)
  if (tipo === 'amarilla') {
    const nj = window.__arNombreJugadorDe || {};
    const yaTienen = seleccion.filter(id =>
      b.tarjetas.some(t => t.jugadorId === id && t.tipo === 'amarilla') ||
      (window.__arTarjetasGuardadas || []).some(t => t.jugadorId === id && t.tipo === 'amarilla'));
    if (yaTienen.length && !confirm('Ya tiene amarilla en este partido:\n' + yaTienen.map(id => nj[id] || '—').join('\n') + '\n\n¿Agregarle otra amarilla?')) return;
  }

  seleccion.forEach(jugadorId => b.tarjetas.push({ id: idTarjetaNueva(), equipoId, jugadorId, tipo, observaciones: obs }));
  guardarBorrador();
  // Se limpia la selección para agregar las siguientes (el equipo queda elegido)
  window.__arSeleccion = [];
  document.getElementById('ar_obs').value = '';
  arElegirTipo('amarilla');
  arPintarTarjetas();
}

function arQuitarTarjeta(id) {
  const b = window.__arBorrador; if (!b) return;
  if (!confirm('¿Quitar esta tarjeta de la lista? (todavía no se había guardado)')) return;
  b.tarjetas = b.tarjetas.filter(t => t.id !== id);
  guardarBorrador();
  arPintarTarjetas();
}

async function arbitroGuardarYFinalizar() {
  const btn = document.getElementById('ar_btn_final');
  if (!btn || btn.disabled) return;
  const m = window.__arMatch, b = window.__arBorrador, teamA = window.__arTeams.a, teamB = window.__arTeams.b;
  const errEl = document.getElementById('ar_final_error');
  errEl.textContent = '';
  const arbitro = String(b.arbitro || '').trim();
  if (!arbitro) { alert('Escribe el nombre del árbitro.'); return; }
  if (String(b.golesA).trim() === '' || String(b.golesB).trim() === '') { alert('Completa el marcador de los dos equipos (si un equipo no hizo goles, escribe 0).'); return; }
  const gA = parseInt(b.golesA, 10), gB = parseInt(b.golesB, 10);
  if (isNaN(gA) || isNaN(gB) || gA < 0 || gB < 0) { alert('El marcador no es válido.'); return; }

  const equipoDe = window.__arEquipoDeJugador || {};
  const golesLista = Object.entries(b.goles || {}).filter(([jid, n]) => n > 0 && equipoDe[jid]).map(([jid, n]) => [jid, equipoDe[jid], n]);
  const sumA = golesLista.filter(g => g[1] === teamA.id).reduce((s, g) => s + g[2], 0);
  const sumB = golesLista.filter(g => g[1] === teamB.id).reduce((s, g) => s + g[2], 0);
  const avisos = [];
  if (sumA !== gA) avisos.push(`${teamA.nombre}: el marcador dice ${gA}, pero los goles por jugador suman ${sumA}.`);
  if (sumB !== gB) avisos.push(`${teamB.nombre}: el marcador dice ${gB}, pero los goles por jugador suman ${sumB}.`);
  if (avisos.length && !confirm(avisos.join('\n') + '\n\nSi la diferencia es por un autogol, puedes guardar así.\n¿Guardar de todas formas?')) return;
  if (!confirm(`Vas a guardar:\n\n${teamA.nombre} ${gA} - ${gB} ${teamB.nombre}\nGoleadores: ${golesLista.length}\nTarjetas nuevas: ${b.tarjetas.length}\n\nDespués de esto el partido queda CERRADO y ya no se puede cambiar.\n¿Guardar y finalizar?`)) return;

  btn.disabled = true;
  const textoOriginal = btn.textContent;
  btn.textContent = 'Guardando…';
  try {
    await gsCall('registrarPartidoCompleto', m.id, { golesA: gA, golesB: gB, arbitroNombre: arbitro, goles: golesLista, tarjetas: b.tarjetas });
    borrarBorrador(m.id);
    window.__arBorrador = null;
    window.__arMatch.finalizado = true;
    window.__arMatch.golesA = gA; window.__arMatch.golesB = gB;
    window.__arMatch.arbitroNombre = arbitro.toUpperCase();
    await arbitroRedibujar();
    alert('✅ Partido guardado y cerrado.');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = textoOriginal;
    errEl.textContent = 'No se pudo guardar (' + ((e && e.message) || 'error de conexión') + '). No se perdió nada: los datos siguen aquí. Revisa la señal y vuelve a tocar el botón.';
  }
}

async function arbitroCargarJugadores() {
  const equipoId = document.getElementById('ar_equipo').value;
  const lista = document.getElementById('ar_jugador_lista');
  document.getElementById('ar_jugador').value = '';
  window.__arSeleccion = [];
  arPintarSeleccion();
  if (!equipoId) { lista.className = 'muted'; lista.innerHTML = 'Elige primero el equipo…'; return; }
  lista.className = 'muted'; lista.innerHTML = 'Cargando…';
  let players;
  try {
    players = (await gsCall('getJugadores', equipoId)).filter(p => p.activo !== false);
  } catch (e) {
    lista.className = 'muted';
    lista.innerHTML = 'No se pudo cargar la lista. (Detalle: ' + esc((e && e.message) || e) + ')' +
      '<div style="margin-top:8px"><button class="btn-ghost" onclick="arbitroCargarJugadores()">Reintentar</button></div>';
    return;
  }
  lista.className = 'stack';
  if (players.length === 0) { lista.className = 'muted'; lista.innerHTML = 'Este equipo no tiene jugadores registrados.'; return; }
  lista.innerHTML = players.map(p => `<div class="card row" id="arp_${p.id}" style="cursor:pointer;align-items:center;padding:8px" onclick="arbitroSeleccionarJugador('${p.id}')">
    <div class="ar-chk" style="width:28px;height:28px;border-radius:6px;border:2px solid #c7d2c9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0"></div>
    <div class="photo" style="width:44px;height:44px">${p.fotoUrl ? `<img src="${esc(p.fotoUrl)}">` : ''}</div>
    <div style="flex:1">
      <div style="font-weight:600;font-size:14px">${esc(p.nombre)}</div>
      <div class="muted">#${esc(p.numero)} · ${esc(p.posicion)}</div>
    </div>
  </div>`).join('');
  arPintarSeleccion();
}

// ---- Selección de jugadores para tarjetas ----
// AMARILLA: se pueden marcar VARIOS jugadores del equipo a la vez (sin observaciones).
// ROJA: un solo jugador, con observaciones (el motivo de la expulsión).
window.__arSeleccion = [];
function arTipoActual() { const el = document.getElementById('ar_tipo'); return el ? el.value : 'amarilla'; }

function arElegirTipo(tipo) {
  document.getElementById('ar_tipo').value = tipo;
  const am = document.getElementById('ar_tipo_amarilla'), ro = document.getElementById('ar_tipo_roja');
  am.style.background = tipo === 'amarilla' ? '#FDECC8' : 'transparent';
  am.style.borderColor = tipo === 'amarilla' ? '#B8860B' : '#c7d2c9';
  am.style.borderWidth = tipo === 'amarilla' ? '2px' : '1px';
  ro.style.background = tipo === 'roja' ? '#FBEAE9' : 'transparent';
  ro.style.borderColor = tipo === 'roja' ? '#B3261E' : '#c7d2c9';
  ro.style.borderWidth = tipo === 'roja' ? '2px' : '1px';
  document.getElementById('ar_obs_wrap').style.display = tipo === 'roja' ? 'block' : 'none';
  document.getElementById('ar_jug_titulo').textContent = tipo === 'roja'
    ? 'Jugador expulsado (toca uno solo)'
    : 'Jugadores (toca todos los que recibieron amarilla)';
  if (tipo === 'roja' && window.__arSeleccion.length > 1) window.__arSeleccion = [];   // la roja es de a uno
  arPintarSeleccion();
}

function arbitroSeleccionarJugador(id) {
  const sel = window.__arSeleccion;
  if (arTipoActual() === 'roja') {
    window.__arSeleccion = (sel.length === 1 && sel[0] === id) ? [] : [id];
  } else {
    window.__arSeleccion = sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id];
  }
  arPintarSeleccion();
}

function arPintarSeleccion() {
  const sel = window.__arSeleccion;
  const roja = arTipoActual() === 'roja';
  const colorSel = roja ? '#B3261E' : '#B8860B', fondoSel = roja ? '#FBEAE9' : '#FDECC8';
  document.querySelectorAll('#ar_jugador_lista .card').forEach(el => {
    const id = el.id.replace('arp_', '');
    const marcado = sel.includes(id);
    el.style.border = marcado ? `2px solid ${colorSel}` : '1px solid transparent';
    el.style.background = marcado ? fondoSel : '#fff';
    const chk = el.querySelector('.ar-chk');
    if (chk) { chk.textContent = marcado ? '✓' : ''; chk.style.background = marcado ? colorSel : '#fff'; chk.style.borderColor = marcado ? colorSel : '#c7d2c9'; }
  });
  const hid = document.getElementById('ar_jugador'); if (hid) hid.value = sel[0] || '';
  const btn = document.getElementById('ar_btn_agregar');
  if (btn) {
    const n = sel.length;
    btn.textContent = roja
      ? (n ? '+ Agregar roja a la lista' : '+ Agregar a la lista')
      : (n ? `+ Agregar ${n} amarilla${n === 1 ? '' : 's'} a la lista` : '+ Agregar a la lista');
  }
}

function tarjetaCardHtml(t, nombreEquipoDe, nombreJugadorDe) {
  const color = t.tipo === 'roja' ? {c:'#B3261E', bg:'#FBEAE9', label:'Roja'} : {c:'#7A4E00', bg:'#FDECC8', label:'Amarilla'};
  const pagada = t.pagada === true || String(t.pagada).toUpperCase() === 'TRUE';
  return `<div class="card">
    <div class="row" style="align-items:center">
      <span class="badge" style="color:${color.c};background:${color.bg}">${color.label}</span>
      <div style="flex:1">
        <div style="font-weight:600">${nombreJugadorDe[t.jugadorId] || '—'}</div>
        <div class="muted">${esc(nombreEquipoDe[t.equipoId]||'')}</div>
      </div>
    </div>
    ${t.observaciones ? `<div style="margin-top:6px;font-size:14px">${esc(t.observaciones)}</div>` : ''}
    ${t.tipo === 'roja' && t.jornadasSancion ? `<div style="margin-top:6px;font-size:13px;color:#B3261E">Suspensión: ${esc(t.jornadasSancion)} fecha${Number(t.jornadasSancion)===1?'':'s'} desde la fecha ${esc(t.jornada||'—')}</div>` : ''}
    <div style="margin-top:8px">${pagada
      ? '<span class="badge" style="color:#2E7D46;background:#E3F3E8">Pagada</span>'
      : '<span class="badge" style="color:#8a978d;background:#eef1ee">Pendiente de pago</span>'}</div>
  </div>`;
}

entrarAutomatico();
</script>
</body>
</html>
