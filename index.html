<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torneo Sintrainagro</title>
<meta property="og:title" content="Torneo Sintrainagro">
<meta property="og:description" content="Ingresa con tu PIN para gestionar tu equipo, jugadores y partidos.">
<meta property="og:image" content="https://torneosintrainagro-s.github.io/torneosintrainagro/logo.png">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="logo.png">
<base target="_top">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&family=Bebas+Neue&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Work Sans',system-ui,sans-serif; background:#EEF3ED; color:#152922; font-size:16px; }
  .bebas { font-family:'Bebas Neue',sans-serif; letter-spacing:.02em; }
  header { background:#123626; color:#F2F5F0; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20; }
  header .brand { font-size:26px; }
  header button { background:transparent; border:1px solid #3F7D58; color:#CFE8D8; border-radius:20px; padding:7px 13px; font-size:14px; cursor:pointer; }
  main { max-width:720px; margin:0 auto; padding:16px 14px 90px; }
  h2.bebas { font-size:28px; margin:0; }
  .sub { margin:2px 0 14px; font-size:15px; color:#5b6b62; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  input, select { width:100%; padding:12px; border-radius:8px; border:1px solid #d8ded8; margin-bottom:8px; font-size:16px; font-family:inherit; }
  label.chk { display:flex; align-items:center; gap:8px; font-size:15px; margin:10px 0; }
  .btn-primary { background:#123626; color:#fff; border:none; border-radius:10px; padding:12px 18px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-ghost { background:transparent; color:#123626; border:1px solid #c7d2c9; border-radius:10px; padding:12px 18px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-add { width:100%; background:#fff; border:1px dashed #9db3a2; border-radius:12px; padding:16px; font-size:16px; font-weight:600; color:#123626; cursor:pointer; }
  .badge { font-size:13px; font-weight:600; padding:4px 10px; border-radius:20px; margin-right:6px; display:inline-block; }
  table.resumen { width:100%; border-collapse:collapse; font-size:13px; }
  table.resumen th, table.resumen td { padding:7px 8px; text-align:center; border-bottom:1px solid #eef1ee; white-space:nowrap; }
  table.resumen th { background:#123626; color:#fff; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  table.resumen td:nth-child(2), table.resumen th:nth-child(2) { text-align:left; white-space:normal; }
  table.resumen tbody tr:nth-child(odd) { background:#F7FAF7; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stack { display:flex; flex-direction:column; gap:10px; }
  .photo { width:80px; height:80px; border-radius:10px; background:#dfe7e0; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .photo img { width:100%; height:100%; object-fit:cover; }
  .photo.clickable { cursor:pointer; }
  .lightbox { position:fixed; inset:0; background:rgba(10,20,15,.9); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:14px; }
  .tabbar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e2e8e3; display:flex; z-index:20; }
  .tabbar button { flex:1; border:none; background:transparent; padding:10px 4px 12px; font-size:13px; font-weight:600; color:#8a978d; cursor:pointer; }
  .tabbar button.active { color:#123626; }
  .row { display:flex; gap:10px; align-items:center; }
  .toggle { border:none; border-radius:20px; padding:8px 12px; font-size:14px; font-weight:600; background:#eef1ee; color:#5b6b62; cursor:pointer; }
  .toggle:disabled { opacity:.4; cursor:not-allowed; }
  .toggle.on-t { background:#123626; color:#fff; }
  .toggle.on-s { background:#3F7D58; color:#fff; }
  .muted { color:#8a978d; font-size:15px; }
  .pin-input { letter-spacing:6px; font-size:26px; text-align:center; font-family:'Bebas Neue',sans-serif; }
</style>
</head>
<body>
<header>
  <div class="brand bebas">Torneo Sintrainagro</div>
  <div id="whoami"></div>
</header>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwSPtk7m5Ulc2EcSQ486KZFoJiL91dG9sZeKXIFb07oWifRyuQmVobIVlJvFJUawdPK/exec';

// Memoria local ultra rápida para no recargar constantemente la base de datos de Google
window.__torneoStore = JSON.parse(localStorage.getItem('torneo_db_v1') || '{}');

function guardarStoreLocal(data) {
  window.__torneoStore = data;
  try { localStorage.setItem('torneo_db_v1', JSON.stringify(data)); } catch(e){}
}

async function gsCall(fn, ...args) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: fn, params: args })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Error en la petición');
  return json.data;
}

// Carga acelerada: Pide todo el estado en una sola consulta batch
async function cargarDatosTorneoBatch(forzarServidor = false) {
  if (!forzarServidor && window.__torneoStore && window.__torneoStore.equipos) {
    // Retornar almacenamiento local de inmediato (0ms) y actualizar silenciosamente en segundo plano
    gsCall('getTorneoInitData').then(data => guardarStoreLocal(data)).catch(()=>{});
    return window.__torneoStore;
  }
  const data = await gsCall('getTorneoInitData');
  guardarStoreLocal(data);
  return data;
}

const CANCHAS = ['Cancha la Agrícola', 'Cancha la Floresta', 'Cancha Unidad Deportiva'];
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtFechaPartido(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : String(iso);
}

// Compresión extrema de fotos a 180px / calidad 0.4 para evitar demoras
function resizeImage(file, maxSize=180, quality=0.4){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        const scale = Math.min(1, maxSize/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

const app = document.getElementById('app');
let STATE = { tab: null, rol: null, team: null };

function renderPinGate(errorMsg) {
  document.getElementById('whoami').innerHTML = '';
  app.innerHTML = `<div style="padding-top:24px">
    <h2 class="bebas" style="font-size:34px;margin:0 0 4px">Ingresa tu PIN</h2>
    <p class="sub">El organizador tiene su PIN. Cada equipo tiene el suyo. Los árbitros también tienen un PIN propio.</p>
    <div class="card">
      <input id="pinInput" class="pin-input" maxlength="6" inputmode="numeric" placeholder="••••">
      <div style="color:#B3261E;font-size:13px;margin-bottom:8px">${errorMsg ? esc(errorMsg) : ''}</div>
      <button class="btn-primary" onclick="intentarPin()">Entrar</button>
    </div>
  </div>`;
  const pIn = document.getElementById('pinInput');
  pIn.focus();
  pIn.addEventListener('keydown', e => { if (e.key === 'Enter') intentarPin(); });
}

async function intentarPin() {
  const pin = document.getElementById('pinInput').value.trim();
  if (!pin) return;
  const res = await gsCall('verificarPin', pin);
  if (!res) { renderPinGate('PIN incorrecto. Intenta de nuevo.'); return; }
  
  // Precargar los datos en lote antes de ingresar
  await cargarDatosTorneoBatch(true);

  if (res.rol === 'organizador') {
    STATE.rol = 'organizador'; STATE.tab = 'resumen';
    document.getElementById('whoami').innerHTML = '<button onclick="cerrarSesion()">Organizador · salir</button>';
    renderOrg();
  } else if (res.rol === 'arbitro') {
    STATE.rol = 'arbitro'; STATE.tab = 'partidos';
    document.getElementById('whoami').innerHTML = '<button onclick="cerrarSesion()">Árbitro · salir</button>';
    renderArbitro();
  } else {
    STATE.rol = 'equipo'; STATE.team = res.equipo; STATE.tab = 'planilla';
    document.getElementById('whoami').innerHTML = `<button onclick="cerrarSesion()">${esc(res.equipo.nombre)} · salir</button>`;
    renderDelegate();
  }
}

function cerrarSesion() { STATE = { tab: null, rol: null, team: null }; renderPinGate(); }

// ================= ORGANIZADOR =================
async function renderOrg() {
  const tabs = [['resumen','Resumen'],['equipos','Equipos'],['carnets','Carnets'],['partidos','Partidos']];
  app.innerHTML = '<div id="content"></div>' + tabBarHtml(tabs, STATE.tab, 'renderOrg');
  const content = document.getElementById('content');
  
  if (STATE.tab === 'resumen') content.innerHTML = await orgResumenHtml();
  if (STATE.tab === 'equipos') content.innerHTML = await orgEquiposHtml();
  if (STATE.tab === 'carnets') content.innerHTML = await orgCarnetsHtml();
  if (STATE.tab === 'partidos') content.innerHTML = await orgPartidosHtml();
}

function tabBarHtml(tabs, active, renderFn) {
  return '<div class="tabbar">' + tabs.map(([k,l]) =>
    `<button class="${active===k?'active':''}" onclick="STATE.tab='${k}'; ${renderFn}();">${l}</button>`
  ).join('') + '</div>';
}

function descargarTablaPDF(titulo, headers, rows, filename) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text(titulo, 14, 15);
  doc.autoTable({ head: [headers], body: rows, startY: 20, styles: { fontSize: 9 }, headStyles: { fillColor: [18, 54, 38] } });
  doc.save(filename);
}

function descargarPosicionesPDF() {
  const headers = ['#', 'Equipo', 'PJ', 'Pts', 'GF', 'GC', 'DG', 'TA', 'TR'];
  const rows = window.__resumen.posiciones.map((t, i) => [i + 1, t.nombre, t.pj, t.pts, t.gf, t.gc, (t.dg > 0 ? '+' : '') + t.dg, t.ta, t.tr]);
  descargarTablaPDF('Tabla de posiciones', headers, rows, 'tabla_posiciones.pdf');
}

async function orgResumenHtml() {
  const data = await cargarDatosTorneoBatch();
  const teams = data.equipos || [], matches = data.partidos || [], tarjetas = data.tarjetas || [], golesTodos = data.goles || [], players = data.jugadores || [];

  const statsDe = {};
  teams.forEach(t => { statsDe[t.id] = { id: t.id, nombre: t.nombre, pj: 0, pts: 0, gf: 0, gc: 0, ta: 0, tr: 0 }; });
  matches.forEach(m => {
    const tieneResultado = m.golesA !== '' && m.golesA !== undefined && m.golesA !== null;
    if (!tieneResultado) return;
    const a = statsDe[m.equipoA], b = statsDe[m.equipoB];
    if (!a || !b) return;
    const gA = Number(m.golesA), gB = Number(m.golesB);
    a.pj++; b.pj++;
    a.gf += gA; a.gc += gB;
    b.gf += gB; b.gc += gA;
    if (gA > gB) a.pts += 3;
    else if (gA < gB) b.pts += 3;
    else { a.pts += 1; b.pts += 1; }
  });
  tarjetas.forEach(t => {
    const s = statsDe[t.equipoId];
    if (!s) return;
    if (t.tipo === 'amarilla') s.ta++;
    else if (t.tipo === 'roja') s.tr++;
  });
  const posiciones = Object.values(statsDe).map(s => Object.assign({}, s, { dg: s.gf - s.gc }));
  posiciones.sort((x, y) => (y.pts - x.pts) || (y.dg - x.dg) || ((x.ta + x.tr) - (y.ta + y.tr)));

  window.__resumen = { posiciones };

  let html = `<h2 class="bebas">Resumen del torneo</h2><p class="sub">Actualizado en tiempo real.</p>`;
  html += `<div class="card">
    <div class="row" style="align-items:center;margin-bottom:8px">
      <div style="flex:1;font-weight:600">Tabla de posiciones</div>
      <button class="btn-ghost" onclick="descargarPosicionesPDF()">Descargar PDF</button>
    </div>`;
  if (posiciones.length === 0) html += '<p class="muted">Aún no hay equipos inscritos.</p>';
  else {
    html += `<div style="overflow-x:auto"><table class="resumen"><thead><tr>
      <th>#</th><th>Equipo</th><th>PJ</th><th>Pts</th><th>GF</th><th>GC</th><th>DG</th><th>TA</th><th>TR</th>
    </tr></thead><tbody>` +
      posiciones.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.nombre)}</td><td>${t.pj}</td><td><strong>${t.pts}</strong></td><td>${t.gf}</td><td>${t.gc}</td><td>${t.dg > 0 ? '+' : ''}${t.dg}</td><td><span class="badge" style="color:#7A4E00;background:#FDECC8">${t.ta}</span></td><td><span class="badge" style="color:#B3261E;background:#FBEAE9">${t.tr}</span></td></tr>`).join('') +
      '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}

async function orgEquiposHtml() {
  const data = await cargarDatosTorneoBatch();
  const teams = data.equipos || [], players = data.jugadores || [];
  const countDe = {};
  players.forEach(p => { countDe[p.equipoId] = (countDe[p.equipoId] || 0) + 1; });
  window.__teamsData = {};
  teams.forEach(t => { window.__teamsData[t.id] = Object.assign({}, t, { jugadores: countDe[t.id] || 0 }); });

  let html = `<h2 class="bebas">Equipos del torneo</h2><p class="sub">${teams.length} equipo(s) inscrito(s)</p>`;
  teams.forEach(t => {
    const n = countDe[t.id] || 0;
    html += `<div class="card">
      <div style="font-weight:600;font-size:16px">${esc(t.nombre)}</div>
      <div class="muted">Delegado: ${esc(t.delegado)||'—'} · DT: ${esc(t.dt)||'—'}</div>
      <div class="muted">${n} jugador(es)</div>
      <div class="row" style="margin-top:8px">
        <div class="bebas" style="font-size:20px;letter-spacing:3px">PIN ${esc(t.pin)}</div>
        <button class="btn-ghost" onclick="regenerarPin('${t.id}')">PIN nuevo</button>
      </div>
      <div class="row" style="margin-top:8px;gap:8px">
        <button class="btn-ghost" onclick="editarEquipoForm('${t.id}')">Editar</button>
        <button class="btn-ghost" style="color:#B3261E;border-color:#f3c9c5" onclick="confirmarEliminarEquipo('${t.id}')">Eliminar</button>
      </div>
    </div>`;
  });
  html += `<div class="card" id="teamForm" style="display:none">
    <div class="muted" id="teamFormTitle" style="margin-bottom:6px">Nuevo equipo</div>
    <input type="hidden" id="t_id" value="">
    <input id="t_nombre" placeholder="Nombre del equipo">
    <input id="t_delegado" placeholder="Nombre del delegado">
    <input id="t_dt" placeholder="Nombre del técnico/DT">
    <button class="btn-primary" onclick="submitTeam()">Guardar equipo</button>
    <button class="btn-ghost" onclick="cerrarTeamForm()">Cancelar</button>
  </div>
  <button class="btn-add" id="addTeamBtn" onclick="abrirTeamForm()">+ Agregar equipo</button>`;
  return html;
}

function abrirTeamForm() {
  document.getElementById('teamFormTitle').textContent = 'Nuevo equipo';
  document.getElementById('t_id').value = ''; document.getElementById('t_nombre').value = '';
  document.getElementById('t_delegado').value = ''; document.getElementById('t_dt').value = '';
  document.getElementById('teamForm').style.display = 'block'; document.getElementById('addTeamBtn').style.display = 'none';
}

function cerrarTeamForm() {
  document.getElementById('teamForm').style.display = 'none'; document.getElementById('addTeamBtn').style.display = 'block';
}

function editarEquipoForm(equipoId) {
  const t = window.__teamsData[equipoId];
  if (!t) return;
  document.getElementById('teamFormTitle').textContent = 'Editar equipo';
  document.getElementById('t_id').value = t.id; document.getElementById('t_nombre').value = t.nombre || '';
  document.getElementById('t_delegado').value = t.delegado || ''; document.getElementById('t_dt').value = t.dt || '';
  document.getElementById('teamForm').style.display = 'block'; document.getElementById('addTeamBtn').style.display = 'none';
}

async function submitTeam() {
  const nombre = document.getElementById('t_nombre').value.trim();
  if (!nombre) return;
  const id = document.getElementById('t_id').value;
  const delegado = document.getElementById('t_delegado').value.trim();
  const dt = document.getElementById('t_dt').value.trim();
  if (id) await gsCall('editarEquipo', id, nombre, delegado, dt);
  else await gsCall('addEquipo', nombre, delegado, dt);
  await cargarDatosTorneoBatch(true);
  renderOrg();
}

async function confirmarEliminarEquipo(equipoId) {
  if (!confirm('¿Eliminar equipo? Esta acción no se puede deshacer.')) return;
  await gsCall('eliminarEquipo', equipoId);
  await cargarDatosTorneoBatch(true);
  renderOrg();
}

async function regenerarPin(equipoId) {
  await gsCall('regenerarPinEquipo', equipoId);
  await cargarDatosTorneoBatch(true);
  renderOrg();
}

async function orgCarnetsHtml() {
  const data = await cargarDatosTorneoBatch();
  const teams = data.equipos || [], players = data.jugadores || [];
  let html = `<h2 class="bebas">Carnets del torneo</h2><p class="sub">${players.length} jugador(es) registrados</p>`;
  teams.forEach(t => {
    const n = players.filter(p => p.equipoId === t.id).length;
    html += `<div class="card row" style="align-items:center">
      <div style="flex:1">
        <div style="font-weight:600;font-size:16px">${esc(t.nombre)}</div>
        <div class="muted">${n} carnet(s)</div>
      </div>
      <div class="bebas" style="font-size:26px;color:#123626">${n}</div>
    </div>`;
  });
  return html;
}

async function orgPartidosHtml() {
  const data = await cargarDatosTorneoBatch();
  const matches = data.partidos || [], teams = data.equipos || [];
  const nombreDe = {}; teams.forEach(t => nombreDe[t.id] = t.nombre);
  let html = `<h2 class="bebas">Partidos</h2><p class="sub">Programación de partidos</p>`;
  for (const m of matches) {
    html += `<div class="card">
      <div style="font-weight:600">${esc(m.nombre)}</div>
      <div class="muted">${esc(nombreDe[m.equipoA])} vs ${esc(nombreDe[m.equipoB])}${m.fecha?' · '+fmtFechaPartido(m.fecha):''}</div>
      ${m.cancha?`<div class="muted">📍 ${esc(m.cancha)}</div>`:''}
    </div>`;
  }
  html += `<div class="card" id="matchForm" style="display:none">
    <div class="muted" style="margin-bottom:6px">Nuevo partido</div>
    <input id="m_jornada" type="number" placeholder="Número de fecha">
    <select id="m_a"><option value="">Local…</option>${teams.map(t=>`<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}</select>
    <select id="m_b"><option value="">Visitante…</option>${teams.map(t=>`<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}</select>
    <select id="m_cancha"><option value="">Cancha…</option>${CANCHAS.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>
    <input id="m_fecha" type="date">
    <input id="m_hora" type="time">
    <button class="btn-primary" onclick="submitMatch()">Programar partido</button>
    <button class="btn-ghost" onclick="cerrarMatchForm()">Cancelar</button>
  </div>
  <button class="btn-add" id="addMatchBtn" onclick="abrirMatchForm()">+ Programar partido</button>`;
  return html;
}

function abrirMatchForm() { document.getElementById('matchForm').style.display = 'block'; document.getElementById('addMatchBtn').style.display = 'none'; }
function cerrarMatchForm() { document.getElementById('matchForm').style.display = 'none'; document.getElementById('addMatchBtn').style.display = 'block'; }

async function submitMatch() {
  const jornada = document.getElementById('m_jornada').value;
  const a = document.getElementById('m_a').value, b = document.getElementById('m_b').value;
  const cancha = document.getElementById('m_cancha').value;
  const fecha = document.getElementById('m_fecha').value, hora = document.getElementById('m_hora').value;
  if (!jornada || !a || !b || a===b) return;
  await gsCall('addPartido', Number(jornada), fecha, a, b, hora, cancha);
  await cargarDatosTorneoBatch(true);
  renderOrg();
}

// ================= VISTAS SECUNDARIAS (DELEGADO Y ÁRBITRO) =================
async function renderDelegate() {
  app.innerHTML = `<div class="card"><h2 class="bebas">Panel Delegado (${esc(STATE.team.nombre)})</h2><p class="sub">Bienvenido a la gestión del equipo.</p></div>`;
}

async function renderArbitro() {
  app.innerHTML = `<div class="card"><h2 class="bebas">Panel Árbitro</h2><p class="sub">Planillaje y gestión en cancha.</p></div>`;
}

// Inicializar la aplicación
renderPinGate();
</script>
</body>
</html>
